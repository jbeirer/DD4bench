name: Regression Report

# Builds the regression report from the EOS run history, uploads report.json to
# EOS (read back by the dashboard's Regressions tab) and emails the CERN
# e-group with the report — every run, regardless of content.
#
# Two triggers:
#   • workflow_call    — invoked by the nightly workflow after the benchmarks.
#   • workflow_dispatch — run it by hand from the Actions tab (no benchmark
#     rerun; the report is rebuilt from whatever is already on EOS).

on:
  workflow_call:
  workflow_dispatch:

# Serialise every run of this workflow (nightly call and manual dispatch alike).
# The pull-request comment step reads a PR's comments and then posts if it sees
# none of its own; two overlapping runs could both pass that read before either
# posts, and duplicate a comment into a repository k4Bench does not own. A single
# lane makes the read-then-write safe. `cancel-in-progress: false` lets an
# in-flight run finish its writes rather than being killed mid-post.
concurrency:
  group: regression-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regression-report:
    runs-on: [self-hosted, fcc-ironic]
    # Scopes K4BENCH_PR_COMMENT_TOKEN — the one secret here that can write
    # outside this repository — to an environment rather than leaving it a plain
    # repository secret, so it is reachable only from this job on an allowed
    # branch. Configure it in Settings → Environments → `pr-comments` as:
    #   • Deployment branches: selected branches, `main` only. A run from any
    #     other ref then cannot start with the write token in scope.
    #   • Required reviewers: MUST stay off. Protection rules gate the *job*, not
    #     the comment step, and they apply to every trigger — a reviewer rule
    #     would hold the nightly workflow_call run at the gate and with it
    #     report.json, the EOS upload and the e-group email, none of which write
    #     anywhere but our own storage. Manual dispatch is already limited to
    #     people who can run workflows in this repository; gate it further with
    #     K4BENCH_PR_COMMENT_DRY_RUN rather than with reviewers.
    # Add the token to the environment only after the branch restriction is in
    # place; an environment secret on an unrestricted environment is a
    # repository secret with extra steps.
    environment:
      name: pr-comments
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      CONTAINER_IMAGE: ghcr.io/key4hep/key4hep-images/alma9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up EOS service certificate
        run: |
          mkdir -p "$RUNNER_TEMP/eos-auth"
          echo "${{ secrets.EOS_SERVICE_CERT_BASE64 }}" | base64 -d > "$RUNNER_TEMP/eos-auth/usercert.pem"
          echo "${{ secrets.EOS_SERVICE_KEY_BASE64 }}"  | base64 -d > "$RUNNER_TEMP/eos-auth/userkey.pem"
          chmod 400 "$RUNNER_TEMP/eos-auth/userkey.pem"

      - name: Build report, upload to EOS, notify e-group
        env:
          K4BENCH_DATA_URL:          ${{ vars.K4BENCH_DATA_URL || 'https://k4bench-data.web.cern.ch' }}
          K4BENCH_REGRESSION_EGROUP: ${{ vars.K4BENCH_REGRESSION_EGROUP }}
          K4BENCH_REGRESSION_FROM:   ${{ vars.K4BENCH_REGRESSION_FROM }}
          K4BENCH_DASHBOARD_URL:     ${{ vars.K4BENCH_DASHBOARD_URL }}
          GITHUB_RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Enables the best-effort blame sidecar's PR resolution. The built-in
          # token reads the public Key4hep repos at 1000 req/hr — a night touches
          # only tens of calls — and blame is fully isolated, so an absent or
          # throttled token degrades to diffs-only, never a failed report.
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          # Model-based ranking of the blame candidates. "OpenAI-compatible" is
          # the /chat/completions wire protocol, NOT the vendor — point the URL
          # at any endpoint that speaks it (OpenRouter, Groq, Gemini's compat
          # endpoint, a self-hosted server, …); the model is just K4BENCH_LLM_MODEL.
          # Must be *off-box* (never local inference on this benchmark runner).
          # Endpoint and model enable ranking; the key is optional for keyless
          # endpoints. The whole ranking path stays inside the isolated blame step.
          K4BENCH_LLM_URL:           ${{ vars.K4BENCH_LLM_URL }}
          K4BENCH_LLM_MODEL:         ${{ vars.K4BENCH_LLM_MODEL }}
          K4BENCH_LLM_API_KEY:       ${{ secrets.K4BENCH_LLM_API_KEY }}
          K4BENCH_LLM_MAX_TOKENS:    ${{ vars.K4BENCH_LLM_MAX_TOKENS || '16384' }}
          # The ranker may ask, once per window, to read the code behind an
          # older release boundary in the metric's own history before judging —
          # one extra model call and a bounded GitHub read, and an unranked
          # window rather than a guess whenever it cannot be completed. On by
          # default; set this variable to 0 to turn it off.
          K4BENCH_LLM_HISTORICAL_DIFFS: ${{ vars.K4BENCH_LLM_HISTORICAL_DIFFS }}
          # The pull-request comments below review each selected PR against its
          # whole change window — one call per comment, at most ten a night,
          # feeding the only outward-facing artifact. This optionally spends a
          # stronger model on that pass alone; unset, it uses the model above.
          K4BENCH_LLM_SUMMARY_MODEL: ${{ vars.K4BENCH_LLM_SUMMARY_MODEL }}
          # Bounds the entire optional GitHub+LLM attribution stage. A timeout
          # skips blame.json but cannot affect report.json or notification.
          # Generous, because the stage is one model call per rank group and a
          # wide night has many — plus, where the ranker asks to read an earlier
          # boundary, one more. The limit is there to bound a provider that
          # accepts connections and never progresses, not to pace a healthy run:
          # cutting a working night short costs the whole sidecar.
          K4BENCH_BLAME_TIMEOUT:     ${{ vars.K4BENCH_BLAME_TIMEOUT || '1h' }}
          # Comments on the pull requests the blame ranker holds responsible.
          # The built-in GITHUB_TOKEN above cannot do this: it is read-only and
          # scoped to k4Bench, while these comments land in the Key4hep package
          # repositories. This is a separate token carrying pull-requests:write
          # on exactly the repos listed in .github/blame-comments.yml — with an
          # empty allowlist there the step is a no-op, and with no token at all
          # it only logs what it would have posted.
          K4BENCH_PR_COMMENT_TOKEN:   ${{ secrets.K4BENCH_PR_COMMENT_TOKEN }}
          K4BENCH_PR_COMMENT_DRY_RUN: ${{ vars.K4BENCH_PR_COMMENT_DRY_RUN }}
          K4BENCH_PR_COMMENT_TIMEOUT: ${{ vars.K4BENCH_PR_COMMENT_TIMEOUT || '15m' }}
        run: |
          docker pull "${{ env.CONTAINER_IMAGE }}"
          docker run --rm --init \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt label=disable \
            --volume /cvmfs:/cvmfs:shared \
            --volume "${{ github.workspace }}":/workspace:Z \
            --volume "$RUNNER_TEMP/eos-auth":/tmp/eos-auth:ro,Z \
            --workdir /workspace \
            -e X509_USER_CERT=/tmp/eos-auth/usercert.pem \
            -e X509_USER_KEY=/tmp/eos-auth/userkey.pem \
            -e K4BENCH_DATA_URL -e K4BENCH_REGRESSION_EGROUP \
            -e K4BENCH_REGRESSION_FROM -e K4BENCH_DASHBOARD_URL \
            -e GITHUB_RUN_URL -e GITHUB_TOKEN \
            -e K4BENCH_LLM_URL -e K4BENCH_LLM_MODEL -e K4BENCH_LLM_API_KEY \
            -e K4BENCH_LLM_SUMMARY_MODEL \
            -e K4BENCH_LLM_MAX_TOKENS -e K4BENCH_LLM_HISTORICAL_DIFFS \
            -e K4BENCH_BLAME_TIMEOUT \
            -e K4BENCH_PR_COMMENT_TOKEN -e K4BENCH_PR_COMMENT_DRY_RUN \
            -e K4BENCH_PR_COMMENT_TIMEOUT \
            "${{ env.CONTAINER_IMAGE }}" \
            bash /workspace/.github/scripts/regression_report.sh

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: |
            report/report.json
            report/report.md
            report/blame.json
          if-no-files-found: warn

      - name: Clean up EOS certificate
        if: always()
        run: rm -rf "$RUNNER_TEMP/eos-auth"
