name: Nightly Benchmark

on:
  schedule:
    # 03:00 UTC — Key4hep publishes the day's nightly stack to CVMFS at
    # 00:40–00:58 UTC, so this starts well past the publication window.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Key4hep release to benchmark, e.g. 2026-07-28 (empty: resolve automatically)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # ── Discover detectors and their samples from .github/benchmarks/*.yml ─────
  # All YAML parsing and validation happens here; the output groups samples
  # under their detector so the matrix below fans out one reusable-workflow
  # call per detector (nests samples beneath it in the Actions UI).
  discover:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List benchmark configs
        id: list
        run: |
          pip3 install --quiet 'pyyaml>=6.0,<6.1'
          echo "configs=$(python3 .github/scripts/list_benchmarks.py --grouped)" >> "$GITHUB_OUTPUT"

  # ── Resolve the Key4hep release once for the whole night ──────────────────
  # Every benchmark job below sources the release named here, so one night's 18
  # jobs cannot straddle a publication boundary and end up filed under two
  # different releases. Waiting for the day's stack happens in this job and
  # nowhere else — the matrix jobs consume the answer and never sleep. Needs a
  # CVMFS-mounted runner; the job itself only lists directories.
  resolve-release:
    runs-on: [self-hosted, fcc-ironic]
    timeout-minutes: 150  # covers the ~2 h retry budget with margin
    outputs:
      release:  ${{ steps.resolve.outputs.release }}
      is_today: ${{ steps.resolve.outputs.is_today }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve Key4hep release
        id: resolve
        env:
          RELEASE_REQUESTED: ${{ inputs.release }}
        run: bash .github/scripts/resolve_release.sh

  # ── One reusable-workflow call per detector ───────────────────────────────
  benchmark:
    needs: [discover, resolve-release]
    name: ${{ matrix.group.detector }}
    strategy:
      matrix:
        group: ${{ fromJson(needs.discover.outputs.configs) }}
      fail-fast: false
    uses: ./.github/workflows/benchmark-detector.yml
    with:
      detector:     ${{ matrix.group.detector }}
      samples_json: ${{ toJson(matrix.group.samples) }}
      release:      ${{ needs.resolve-release.outputs.release }}
    secrets: inherit

  # ── Nightly regression report over the full EOS history ────────────────────
  # `if: always()` so a crashed detector job still produces a FAILURE verdict
  # (its missing upload is the signal) instead of the report vanishing. The job
  # body lives in the reusable regression-report.yml, which is also
  # workflow_dispatch-able for a manual, on-demand send.
  regression-report:
    needs: benchmark
    if: always()
    uses: ./.github/workflows/regression-report.yml
    secrets: inherit
